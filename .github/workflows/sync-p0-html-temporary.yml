name: TEMPORARY - regenerate P0 offline HTML on audit branch

on:
  push:
    branches:
      - audit/v3.0-consolidacao-integral-v2-20261107

permissions:
  contents: write

jobs:
  sync-html:
    if: github.ref == 'refs/heads/audit/v3.0-consolidacao-integral-v2-20261107'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v3.0-consolidacao-integral-v2-20261107
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild HTML without touching main
        run: |
          npm run build
          git diff --stat -- index.html
      - name: Commit generated artifact only
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(v3): HTML offline sincronizado com a protecao P0 de persistencia"
            git push origin HEAD:refs/heads/audit/v3.0-consolidacao-integral-v2-20261107
          else
            echo "HTML ja corresponde a src/ui/app.js"
          fi
