name: TEMP QA P1 20261107 - rebuild HTML only audit branch
on:
  push:
    branches:
      - audit/v3.0-consolidacao-integral-v2-20261107
permissions:
  contents: write
jobs:
  sync-offline:
    if: github.ref == 'refs/heads/audit/v3.0-consolidacao-integral-v2-20261107'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v3.0-consolidacao-integral-v2-20261107
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerar HTML deterministico, nao tocar main
        run: |
          npm run build
          git diff --stat -- index.html
      - name: Registrar somente HTML na branch de auditoria
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(v3 P1): HTML offline sincronizado com payroll e restock"
            git push origin HEAD:refs/heads/audit/v3.0-consolidacao-integral-v2-20261107
          else
            echo "HTML ja esta sincronizado"
          fi
