name: Regenerar HTML apenas na branch de auditoria V3.0
on:
  push:
    branches:
      - audit/v3.0-consolidacao-integral-v2-20261107
    paths:
      - .github/workflows/build-audit-v300.yml
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'yagofranca0312-dev/CIDADE-DOS-NEGOCIOS' && github.ref == 'refs/heads/audit/v3.0-consolidacao-integral-v2-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruir artefato idêntico ao pipeline oficial
        run: npm run build
      - name: Commit apenas do HTML gerado na branch auditável
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ja sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "build(v3): atualizar HTML para hotfix de painel sob demanda"
          git push origin HEAD:refs/heads/audit/v3.0-consolidacao-integral-v2-20261107
