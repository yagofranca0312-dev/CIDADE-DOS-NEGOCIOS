name: V333 fechamento dirigido das tres lacunas
on:
  push:
    branches: [fix/v3.3.3-fechamento-lacunas]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: node --test tests/v333_gaps.test.mjs
      - run: git diff --exit-code -- index.html
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: node tools/verify-html-byte-identical-v300.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.1
      - run: node tools/qa-windows-v333-gaps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v333-tres-lacunas
          path: ${{ runner.temp }}/v333-gaps.json
          if-no-files-found: warn
