name: Validacao do Cidade dos Negocios 1
on:
  push:
    branches: [main, feat/v3.3.2-b-atalhos-agenda]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    name: Build do HTML unico e testes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Benchmark de carreiras 30, 365 e 1825 dias (1 e 5 unidades)
        run: npm run bench:stability
      - name: Benchmark V3 consolidacao — views, saves e 5 anos
        run: npm run bench:consolidation
      - name: Gate V3.0 de prontidao — auditar NO-GO sem liberar release
        run: npm run audit:release
      - name: Verificar dispensa excepcional expressa sem falsificar QA
        run: npm run audit:release:exception
      - name: Conferir matriz pos-homologacao sem alterar gate historico
        run: npm run audit:postrelease
      - name: Verificar se index.html gerado corresponde ao commit
        run: git diff --exit-code -- index.html
      - name: SHA-256 do executavel
        run: sha256sum index.html
