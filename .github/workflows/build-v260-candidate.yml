name: Validar e empacotar V2.6.0 homologada pelo titular
on:
  push:
    branches:
      - release/v2.6.0-promocao
permissions:
  contents: write
jobs:
  rebuild:
    name: HTML unico, testes e benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruir executavel offline
        run: npm run build
      - name: Gravar HTML reproduzivel na branch de promocao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "build(v2.6.0): publicar HTML offline estavel [skip ci]"
            git push origin HEAD:release/v2.6.0-promocao
          fi
      - name: Regressao automatizada
        run: npm test
      - name: Benchmarks de estabilidade
        run: npm run bench:stability
      - name: Benchmark completo de concorrência V2.6
        run: npm run bench:competition
      - name: SHA-256 da compilacao
        run: sha256sum index.html
      - name: Publicar pacote da V2.6.0 homologada
        uses: actions/upload-artifact@v4
        with:
          name: CIDADE_DOS_NEGOCIOS_V260_HTML_OFFLINE_HOMOLOGADA
          path: |
            index.html
            docs/V260_PATCH_INTEGRAL.md
            README.md
          if-no-files-found: error
