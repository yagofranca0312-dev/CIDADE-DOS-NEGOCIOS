name: V3.2 Gerar HTML canonico na branch de implementacao
on:
  push:
    branches:
      - feature/v3.1.0-city-first-20261108
      - fix/v3.1.0-fullscreen-tycoon
      - feat/v3.2.0-fiscal-engine
      - feat/v3.3.0-layout-responsive
      - fix/v3.3.1-map-proportion-hud
      - feat/v3.3.2-a-indicadores-superiores
      - feat/v3.3.2-b-atalhos-agenda
      - feat/v3.3.2-c-central-de-gestao
      - feat/v3.3.2-d-polimento-homologacao
      - feat/v3.3.3-a-central-confiabilidade
      - feat/v3.3.3-b-agenda-integrada
      - feat/v3.3.3-c-acoes-contextuais
      - feat/v3.3.3-d-polimento-experiencia
      - feat/v3.3.3-e-qualidade-prehomologacao
    paths:
      - '.github/workflows/v310-build-branch.yml'
      - 'src/**'
      - 'tools/build.mjs'
permissions:
  contents: write
jobs:
  compile:
    if: github.repository == 'yagofranca0312-dev/CIDADE-DOS-NEGOCIOS'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar o HTML unico offline a partir de fontes auditaveis
        run: npm run build
      - name: Integrar exclusivamente o artefato compilado na branch
        run: |
          if git diff --quiet -- index.html; then
            echo "HTML ja corresponde as fontes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "build: regenerate canonical offline HTML"
            git push origin HEAD:refs/heads/${{ github.ref_name }}
          fi
